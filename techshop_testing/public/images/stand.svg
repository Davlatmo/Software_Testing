<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- monitor arm top bar -->
  <rect x="15" y="22" width="70" height="9" rx="4" fill="#0891b2"/>
  <!-- arm vertical -->
  <rect x="44" y="31" width="12" height="32" rx="4" fill="#0e7490"/>
  <!-- hinge joint -->
  <circle cx="50" cy="48" r="7" fill="#0891b2"/>
  <circle cx="50" cy="48" r="4" fill="#0e7490"/>
  <circle cx="50" cy="48" r="2" fill="#67e8f9"/>
  <!-- base plate -->
  <rect x="22" y="63" width="56" height="9" rx="4" fill="#0891b2"/>
  <!-- base feet -->
  <ellipse cx="35" cy="75" rx="9" ry="4" fill="#0e7490"/>
  <ellipse cx="65" cy="75" rx="9" ry="4" fill="#0e7490"/>
  <!-- cable channel detail -->
  <rect x="47" y="34" width="6" height="20" rx="2" fill="#0891b2" opacity="0.5"/>
  <!-- grip texture top bar -->
  <line x1="30" y1="24" x2="30" y2="29" stroke="#67e8f9" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="37" y1="24" x2="37" y2="29" stroke="#67e8f9" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="44" y1="24" x2="44" y2="29" stroke="#67e8f9" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
